[package]
name = "rill"
version = "0.1.0"
edition = "2024"

[features]
default = ["audio-files", "device", "pulseaudio", "watch"]
# Real-time output through the system audio device (cpal). Without it the
# crate still builds the engine and the offline WAV renderer.
device = ["dep:cpal", "dep:anyhow"]
# Talk to PulseAudio directly instead of going through ALSA (useful on WSLg).
pulseaudio = ["device", "cpal/pulseaudio"]
# Reload a playing program when its files change (`rill play`, unless
# `--no-watch`). Without it nothing watches files.
watch = ["dep:notify"]
# Load audio files named by paths in a program (`./kick.wav`). Without it, a
# path to audio is an error that says so.
audio-files = ["dep:symphonia", "dep:rubato"]

[dependencies]
anyhow = { version = "1", optional = true }
clap = { version = "4.6.7", features = ["derive"] }
cpal = { version = "0.18.2", optional = true }
notify = { version = "8.2.0", optional = true }
# Decoding audio files (`const KICK = ./kick.wav`), pure Rust, and
# resampling them to the host rate.
rubato = { version = "0.16", optional = true }
symphonia = { version = "0.5.4", optional = true, default-features = false, features = ["all"] }

# `rill profile` asks the OS how much of a render was spent in the kernel.
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
hound = "3.5.1"

# Audio code needs some optimisation to keep up in real time; without it a
# debug build runs several times slower than release and stutters.
[profile.dev]
opt-level = 1
